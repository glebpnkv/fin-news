[project]
name = "fin-news-models"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.3.0",
    "captum>=0.7.0",
    "datasets>=3.2.0",
    "gluonts[torch]>=0.16.0",
    "pandas>=2.2.3",
    "polars>=1.21.0",
    "pyarrow>=19.0.0",
    "pytorch-forecasting>=1.3.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=3.3.1",
    "tensorboard>=2.20.0",
    "tensorstore>=0.1.80",
    "torch>=2.6.0",
    "transformers>=4.48.3",
    "yfinance>=0.2.52",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"
